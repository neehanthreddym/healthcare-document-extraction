[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "healthcare-document-extraction"
version = "0.1.0"
description = "Synthetic healthcare form OCR, extraction, evidence review and evaluation"
requires-python = ">=3.11,<3.14"
dependencies = [
  "streamlit==1.66.1", "spacy==3.8.16", "PyMuPDF==1.28.2",
  "Pillow==12.3.0", "pandas==2.3.3", "scikit-learn==1.9.1",
  "pytesseract==0.3.13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["intake*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
